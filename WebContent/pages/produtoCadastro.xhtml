<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui"
    template="/templates/template.xhtml">


    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam name="proacao" value="#{MBProdutos.acao}" />
            <f:viewParam name="procod" value="#{MBProdutos.codigo}" />
            <f:event listener="#{MBProdutos.carregarCadastro}" type="preRenderView" />
        </f:metadata>
    </ui:define>


    <ui:define name="conteudo">
        <h:form id="frmprocad">
            <p:toolbar>
                <f:facet name="left">
                    <h:outputText value="Produtos" />
                </f:facet>
            </p:toolbar>
            <h:panelGrid columns="3" id="pnprocad">
                <p:outputLabel value="Código:" />
                <p:inputText maxlength="20" size="10" readonly="true" value="#{MBProdutos.produto.codigo}" />
                <h:outputText />

                <p:outputLabel value="Descrição: *" />
                <p:inputText maxlength="50" size="20" value="#{MBProdutos.produto.descricao}"
                    readonly="#{MBProdutos.acao == 'Excluir'}" required="true"
                    requiredMessage="Insira a Descrição do produto">
                    <f:validateBean />
                </p:inputText>
                <p:message for="@this" display="text" />

                <p:outputLabel value="Valor: *" />
                <p:inputText maxlength="50" size="20" value="#{MBProdutos.produto.preco}"
                    readonly="#{MBProdutos.acao == 'Excluir'}" required="true"
                    requiredMessage="Insira o Preço do produto">
                    <f:validateRegex pattern="^\d+(\.\d{1,2})?$" />
                    <f:validateBean />
                </p:inputText>
                <p:message for="@this" display="text" />

                <p:outputLabel value="Quantidade: *" />
                <p:inputText maxlength="8" size="20" value="#{MBProdutos.produto.quantidade}"
                    readonly="#{MBProdutos.acao == 'Excluir'}" required="true"
                    requiredMessage="Insira a Quantidade do produto">
                    <f:validateRegex pattern="^\d+$" />
                    <f:validateBean />
                </p:inputText>
                <p:message for="@this" display="text" />

                <p:outputLabel value="Fornecedor: *" />
                <p:selectOneMenu value="#{MBProdutos.produto.fornecedor}" disabled="#{MBProdutos.acao == 'Excluir'}"
                    converter="fornecedorConverter" required="true"
                    requiredMessage="Selecione um Fornecedor">
                    <f:selectItem itemValue="" itemLabel="Selecione um Fornecedor" />
                    <f:selectItems value="#{MBProdutos.listaFornecedor}" var="fornecedor" itemValue="#{fornecedor}"
                        itemLabel="#{fornecedor.descricao}" />
                    <f:validateBean />
                </p:selectOneMenu>
                <p:message for="@this" display="text" />


            </h:panelGrid>

            <h:panelGrid columns="5">
                <p:commandButton value="Novo" actionListener="#{MBProdutos.novo}" update=":frmprocad:pnprocad"
                    rendered="#{MBProdutos.acao == 'Novo'}" />
                <p:commandButton value="Salvar" actionListener="#{MBProdutos.salvar}"
                    update=":msgGlobal :frmprocad:pnprocad" process="@form" icon="ui-icon-disk" />

                <p:commandButton value="Excluir" actionListener="#{MBProdutos.excluir}" update=":msgGlobal"
                    rendered="#{MBProdutos.acao == 'Excluir'}" onclick="PF('dlgConfirmExcluir').show()" />
                <p:commandButton value="Editar" actionListener="#{MBProdutos.editar}" update=":msgGlobal"
                    rendered="#{MBProdutos.acao == 'Editar'}" process="@form" icon="ui-icon-disk" />
                <p:button value="Voltar" outcome="/pages/produtoPesquisa.xhtml" icon="ui-icon-arrowreturnthick-1-w" />

            </h:panelGrid>

            <p:dialog header="Confirmar Exclusão" widgetVar="dlgConfirmExcluir" modal="true"
                resizable="false" appendTo="@(body)">
                <h:outputText value="Tem certeza que deseja excluir este produto?" />
                <f:facet name="footer">
                    <p:commandButton value="Sim" actionListener="#{MBProdutos.excluir}"
                        update=":msgGlobal" onclick="PF('dlgConfirmExcluir').hide()" />
                    <p:commandButton value="Não" onclick="PF('dlgConfirmExcluir').hide()" />
                </f:facet>
            </p:dialog>
        </h:form>

    </ui:define>


</ui:composition>
