<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui"
    template="/templates/template.xhtml">


    <ui:define name="conteudo">
        <h:panelGroup style="display: block; text-align: center; padding: 50px;">
            <h2>Bem-vindo ao Sistema de Vendas</h2>
            <p style="color: #666; margin-top: 10px;">
                Utilize o menu ao lado para navegar entre as funcionalidades do sistema.
            </p>

            <h:panelGroup rendered="#{MBLogin.logado}" style="display: block; margin-top: 30px;">
                <p style="font-size: 14px;">
                    Olá, <strong>#{MBLogin.nomeFuncionario}</strong>!
                    <br/>
                    Você está logado como <em>#{MBLogin.funcaoFuncionario}</em>.
                </p>
            </h:panelGroup>
        </h:panelGroup>
    </ui:define>

</ui:composition>
