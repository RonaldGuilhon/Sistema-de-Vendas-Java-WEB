<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui"
    template="/templates/template.xhtml">

    <ui:define name="conteudo">
        <h:form id="frmRelatorio">

            <p:toolbar>
                <f:facet name="left">
                    <h:outputText value="Relatório de Vendas" />
                </f:facet>
                <f:facet name="right">
                    <p:commandButton value="PDF" icon="ui-icon-document"
                        ajax="false" process="@form"
                        actionListener="#{MBRelatorioVendas.gerarRelatorio}">
                        <p:dataExporter type="pdf" target="tbVendas"
                            fileName="relatorio_vendas" />
                    </p:commandButton>
                </f:facet>
            </p:toolbar>

            <p:separator />

            <h:panelGrid columns="5" cellpadding="5">
                <p:outputLabel value="Data Início:" />
                <p:calendar value="#{MBRelatorioVendas.dataInicio}" pattern="dd/MM/yyyy"
                    showOn="button" size="10" mask="true" />

                <p:outputLabel value="Data Fim:" />
                <p:calendar value="#{MBRelatorioVendas.dataFim}" pattern="dd/MM/yyyy"
                    showOn="button" size="10" mask="true" />

                <p:commandButton value="Gerar Relatório"
                    actionListener="#{MBRelatorioVendas.gerarRelatorio}"
                    update=":frmRelatorio:tbVendas :frmRelatorio:pnlResumo" icon="ui-icon-search" />
            </h:panelGrid>

            <p:separator />

            <p:panel id="pnlResumo" header="Resumo"
                rendered="#{not empty MBRelatorioVendas.vendas}">
                <h:panelGrid columns="2" cellpadding="5">
                    <h:outputText value="Total de Vendas:" style="font-weight: bold;" />
                    <h:outputText value="#{MBRelatorioVendas.vendas.size()} venda(s)" />
                    <h:outputText value="Valor Total:" style="font-weight: bold;" />
                    <h:outputText value="#{MBRelatorioVendas.valorTotalVendas}"
                        style="font-weight: bold; color: green; font-size: 14px;" />
                </h:panelGrid>
            </p:panel>

            <p:separator />

            <p:dataTable id="tbVendas" var="venda" value="#{MBRelatorioVendas.vendas}"
                emptyMessage="Nenhuma venda encontrada para o período informado."
                rows="10" paginator="true" rowsPerPageTemplate="5,10,25,50"
                styleClass="vendas-report">

                <p:column headerText="Código">
                    <h:outputText value="#{venda.codigo}" />
                </p:column>

                <p:column headerText="Data/Hora">
                    <h:outputText value="#{venda.horario}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="America/Sao_Paulo" />
                    </h:outputText>
                </p:column>

                <p:column headerText="Funcionário">
                    <h:outputText value="#{venda.funcionario.nome}" />
                </p:column>

                <p:column headerText="Valor Total">
                    <h:outputText value="#{venda.valorTotal}" />
                </p:column>

            </p:dataTable>

        </h:form>
    </ui:define>

</ui:composition>
