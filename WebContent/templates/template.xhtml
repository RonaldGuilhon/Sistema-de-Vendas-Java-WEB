<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://java.sun.com/jsf/facelets">

<ui:insert name="metadata" />

<h:head>

	<h:outputStylesheet library="css" name="style.css" />

	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<title>Sistema de Vendas</title>
</h:head>
<h:body>

<p:growl id="msgGlobal"/>

	<p:layout fullPage="true">

		<p:layoutUnit position="north" height="50"
			resizable="false" closable="false" collapsible="false">
			<h:form>
				<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 15px; height: 100%;">
					<h:outputText value="Sistema de Vendas" style="font-size: 18px; font-weight: bold;" />
					<div style="display: flex; align-items: center; gap: 15px;">
						<h:panelGroup rendered="#{MBLogin.logado}">
							<h:outputText value="Olá, #{MBLogin.nomeFuncionario}" style="margin-right: 5px;" />
							<h:outputText value="(#{MBLogin.funcaoFuncionario})"
								style="color: #666; font-size: 12px;" />
						</h:panelGroup>
						<p:commandButton value="Sair" action="#{MBLogin.logout}"
							icon="ui-icon-extlink" rendered="#{MBLogin.logado}"
							ajax="false" />
					</div>
				</div>
			</h:form>
		</p:layoutUnit>

		<p:layoutUnit position="west" size="250" resizable="false"
			closable="false" collapsible="false">

			<h:form>
				<p:panelMenu>

					<p:submenu label="Arquivo">
						<p:menuitem value="Principal" outcome="/pages/principal.xhtml" />
					</p:submenu>

					<p:submenu label="Cadastros">
						<p:menuitem value="Produtos" outcome="/pages/produtoPesquisa.xhtml" />
						<p:menuitem value="Fornecedores" outcome="/pages/fornecedorPesquisa.xhtml"/>
						<p:menuitem value="Funcionários" outcome="/pages/funcionarioPesquisa.xhtml"
							rendered="#{MBLogin.gerente}" />
					</p:submenu>

					<p:submenu label="Vendas">
						<p:menuitem value="Nova Venda" outcome="/pages/vendaCadastro.xhtml" />
					</p:submenu>

					<p:submenu label="Relatórios" rendered="#{MBLogin.gerente}">
						<p:menuitem value="Vendas" outcome="/pages/relatorioVendas.xhtml" />
						<p:menuitem value="Estoque" outcome="/pages/relatorioEstoque.xhtml" />
					</p:submenu>

				</p:panelMenu>
			</h:form>

		</p:layoutUnit>


		<p:layoutUnit position="center" resizable="false" closable="false"
			collapsible="false">
			<ui:insert name="conteudo" />
		</p:layoutUnit>
	</p:layout>

</h:body>
</html>
