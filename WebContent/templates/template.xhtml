<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://java.sun.com/jsf/facelets">

<ui:insert name="metadata" />

<h:head>
	<h:outputStylesheet library="css" name="style.css" />
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<title>Sistema de Vendas</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		html, body { height: 100%; font-family: Arial, sans-serif; }

		.layout-wrapper { display: flex; flex-direction: column; height: 100vh; }

		.layout-top {
			height: 50px; min-height: 50px;
			background: #333; color: #fff;
			display: flex; align-items: center; justify-content: space-between;
			padding: 0 15px;
		}
		.layout-top-left { display: flex; align-items: center; gap: 5px; }
		.layout-top-right { display: flex; align-items: center; gap: 15px; }

		.layout-middle { display: flex; flex: 1; overflow: hidden; }

		.layout-sidebar {
			width: 250px; min-width: 250px;
			background: #f5f5f5; border-right: 1px solid #ddd;
			overflow-y: auto; padding: 10px 0;
		}

		.layout-content {
			flex: 1; overflow-y: auto; padding: 15px;
		}
	</style>
</h:head>
<h:body>

<h:form id="templateForm">
<p:growl id="msgGlobal"/>

	<div class="layout-wrapper">

		<div class="layout-top">
			<div class="layout-top-left">
				<h:outputText value="Sistema de Vendas" style="font-size: 18px; font-weight: bold;" />
			</div>
			<div class="layout-top-right">
				<h:panelGroup rendered="#{MBLogin.logado}">
					<h:outputText value="Ola, #{MBLogin.nomeFuncionario}" style="margin-right: 5px;" />
					<h:outputText value="(#{MBLogin.funcaoFuncionario})"
						style="color: #ccc; font-size: 12px;" />
				</h:panelGroup>
				<p:commandButton value="Sair" action="#{MBLogin.logout}"
					icon="ui-icon-extlink" rendered="#{MBLogin.logado}"
					ajax="false" style="color:#fff;" />
			</div>
		</div>

		<div class="layout-middle">
			<div class="layout-sidebar">
				<p:panelMenu>
					<p:submenu label="Arquivo">
						<p:menuitem value="Principal" outcome="/pages/principal.xhtml" />
					</p:submenu>

					<p:submenu label="Cadastros">
						<p:menuitem value="Produtos" outcome="/pages/produtoPesquisa.xhtml" />
						<p:menuitem value="Fornecedores" outcome="/pages/fornecedorPesquisa.xhtml"/>
						<p:menuitem value="Funcionarios" outcome="/pages/funcionarioPesquisa.xhtml"
							rendered="#{MBLogin.gerente}" />
					</p:submenu>

					<p:submenu label="Vendas">
						<p:menuitem value="Nova Venda" outcome="/pages/vendaCadastro.xhtml" />
					</p:submenu>

					<p:submenu label="Relatorios" rendered="#{MBLogin.gerente}">
						<p:menuitem value="Vendas" outcome="/pages/relatorioVendas.xhtml" />
						<p:menuitem value="Estoque" outcome="/pages/relatorioEstoque.xhtml" />
					</p:submenu>
				</p:panelMenu>
			</div>

			<div class="layout-content">
				<ui:insert name="conteudo" />
			</div>
		</div>

	</div>

</h:form>

</h:body>
</html>
